<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="600" height="400">
  <defs>
    <linearGradient id="bg2026" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#144528"/>
      <stop offset="100%" stop-color="#0a2817"/>
    </linearGradient>
    <linearGradient id="gold2026" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e5a83b"/>
      <stop offset="100%" stop-color="#c88a22"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg2026)"/>
  <rect x="20" y="20" width="560" height="360" fill="none" stroke="#256e43" stroke-width="1.5" rx="12"/>
  
  <!-- Luminous Year Watermark (Clear & Visible) -->
  <text x="300" y="170" font-family="'Abril Fatface', Georgia, serif" font-size="130" fill="rgba(255, 255, 255, 0.15)" font-weight="400" text-anchor="middle">2026</text>
  
  <!-- Year Badge -->
  <rect x="230" y="45" width="140" height="32" rx="16" fill="#0d0d0d" stroke="#e5a83b" stroke-width="1"/>
  <text x="300" y="66" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#e5a83b" letter-spacing="2" text-anchor="middle">20 YEARS PURITY</text>
  
  <!-- Main Title in Times New Roman -->
  <text x="300" y="225" font-family="'Times New Roman', Times, serif" font-size="30" font-weight="700" fill="#ffffff" text-anchor="middle">500g Premium Plastic Jars</text>
  <text x="300" y="262" font-family="'Plus Jakarta Sans', sans-serif" font-size="14.5" fill="#e0f0e6" text-anchor="middle">Doorstep Cash on Delivery nationwide at PKR 1,500 per jar.</text>
  
  <!-- Divider Line -->
  <line x1="220" y1="290" x2="380" y2="290" stroke="url(#gold2026)" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Sub-Badge -->
  <text x="300" y="325" font-family="'Plus Jakarta Sans', sans-serif" font-size="11.5" font-weight="700" fill="#e5a83b" letter-spacing="3" text-anchor="middle">NATIONWIDE DELIVERY • LAB CERTIFIED</text>
</svg>
