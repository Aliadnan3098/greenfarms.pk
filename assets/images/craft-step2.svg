<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bw2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141414"/>
      <stop offset="100%" stop-color="#050505"/>
    </linearGradient>
    <linearGradient id="wood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a3b32"/>
      <stop offset="50%" stop-color="#735c4d"/>
      <stop offset="100%" stop-color="#3d3028"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bw2)"/>
  <line x1="40" y1="40" x2="760" y2="40" stroke="#333333" stroke-width="1"/>
  <line x1="40" y1="560" x2="760" y2="560" stroke="#333333" stroke-width="1"/>

  <!-- Earthen Matka / Traditional Churner (Bilona) vector art -->
  <g transform="translate(400, 360)">
    <!-- Base shadow -->
    <ellipse cx="0" cy="160" rx="160" ry="25" fill="#000000" opacity="0.6"/>
    <!-- Clay Pot / Handi -->
    <path d="M-120,80 C-150,0 -120,-80 -60,-120 L60,-120 C120,-80 150,0 120,80 C90,140 -90,140 -120,80 Z" fill="#222222" stroke="#383838" stroke-width="2"/>
    <!-- Pot rim -->
    <ellipse cx="0" cy="-120" rx="65" ry="16" fill="#2a2a2a" stroke="#444444" stroke-width="2"/>
    <ellipse cx="0" cy="-120" rx="55" ry="12" fill="#111111"/>
    <!-- Churning rod (Mathani / Bilona shaft) -->
    <rect x="-8" y="-240" width="16" height="200" fill="#444444" rx="3"/>
    <!-- Whirling butter crests -->
    <ellipse cx="0" cy="-115" rx="50" ry="8" fill="#f8f9f8" opacity="0.85"/>
    <path d="M-25,-125 C-10,-140 10,-140 25,-125 C35,-110 -15,-105 -25,-125 Z" fill="#ffffff"/>
    <circle cx="15" cy="-135" r="5" fill="#f3efe6"/>
    <circle cx="-18" cy="-130" r="4" fill="#f3efe6"/>
  </g>

  <g transform="translate(60, 80)">
    <rect width="180" height="32" fill="#144528" rx="4"/>
    <text x="90" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="2" text-anchor="middle">STEP 02 • BILONA CHURN</text>
    <text x="0" y="65" font-family="'Times New Roman', Times, serif" font-size="32" fill="#ffffff">Cultured White Butter</text>
    <text x="0" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#a0a0a0">Slow-churned curd (makkhan), never industrial cream.</text>
  </g>
  <g transform="translate(680, 530)">
    <text x="0" y="0" font-family="'Times New Roman', Times, serif" font-size="48" fill="#262626" text-anchor="end">02</text>
  </g>
</svg>