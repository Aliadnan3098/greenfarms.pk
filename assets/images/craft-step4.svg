    <!-- Text around circle -->
    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="700" fill="#c88a22" letter-spacing="3" text-anchor="middle">LAB VERIFIED • 99.8% MILKFAT</text>
  </g>

  <g transform="translate(60, 80)">
    <rect width="180" height="32" fill="#144528" rx="4"/>
    <text x="90" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="2" text-anchor="middle">STEP 04 • BATCH TESTING</text>
    <text x="0" y="65" font-family="'Abril Fatface', serif" font-size="32" fill="#ffffff">Sealed Purity</text>
    <text x="0" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#a0a0a0">Zero moisture (&lt;0.2%), zero palm oil, bottled in UV jars.</text>
  </g>
  <g transform="translate(680, 530)">
