<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bw4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bw4)"/>
  <line x1="40" y1="40" x2="760" y2="40" stroke="#333333" stroke-width="1"/>
  <line x1="40" y1="560" x2="760" y2="560" stroke="#333333" stroke-width="1"/>

  <!-- Lab Seal & Sealed Jar icon graphic -->
  <g transform="translate(400, 330)">
    <!-- Concentric purity rings -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#242424" stroke-width="2"/>
    <circle cx="0" cy="0" r="110" fill="none" stroke="#144528" stroke-width="3" stroke-dasharray="8 6"/>
    <circle cx="0" cy="0" r="85" fill="#144528" opacity="0.2"/>
    <!-- Stamp Ribbon / Shield -->
    <path d="M-40,-50 L40,-50 L40,30 L0,55 L-40,30 Z" fill="#144528"/>
    <!-- Checkmark inside -->
