<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
  <rect width="900" height="480" fill="#f8f9f8" rx="12"/>
  <rect x="20" y="20" width="410" height="440" fill="#ffffff" rx="8" stroke="#e0e4e0" stroke-width="1.5"/>
  <rect x="470" y="20" width="410" height="440" fill="#ffffff" rx="8" stroke="#eedddd" stroke-width="1.5"/>

  <!-- Left: GreenFarms Authentic Butter-Churned Danedar Texture -->
  <g transform="translate(40, 50)">
    <rect width="140" height="26" fill="#144528" rx="4"/>
    <text x="70" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">GREENFARMS METHOD</text>
    <text x="0" y="60" font-family="'Abril Fatface', serif" font-size="26" fill="#144528">Granular Danedar Crystals</text>
    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#555555">Micro-crystalline fat matrices formed by slow cooling.</text>
    
    <!-- Microscopic crystal representation -->
    <g transform="translate(185, 230)">
      <circle cx="0" cy="0" r="110" fill="#fef7e9" stroke="#c88a22" stroke-width="2"/>
      <!-- Scattered sharp crystalline clusters -->
      <polygon points="0,-70 20,-40 -10,-30" fill="#c88a22"/>
      <polygon points="-40,-50 -20,-20 -50,-10" fill="#e5a83b"/>
      <polygon points="50,-40 70,-20 30,-10" fill="#c88a22"/>
      <polygon points="-60,10 -30,20 -40,50" fill="#df9f2f"/>
      <polygon points="40,10 60,30 20,40" fill="#c88a22"/>
      <polygon points="-10,40 10,70 -30,60" fill="#e5a83b"/>
      <polygon points="20,50 40,80 0,70" fill="#c88a22"/>
      <polygon points="-20,-10 0,10 -30,10" fill="#df9f2f"/>
      <polygon points="10,-20 30,-5 5,0" fill="#c88a22"/>
    </g>
    <text x="185" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#144528" text-anchor="middle">✓ Aromatic • Nutty • Melts on warm tongue</text>
  </g>

  <!-- Right: Commercial Cream-Boiled Flat Paste -->
  <g transform="translate(490, 50)">
    <rect width="140" height="26" fill="#666666" rx="4"/>
    <text x="70" y="17" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="700" fill="#ffffff" letter-spacing="1.5" text-anchor="middle">COMMERCIAL BRANDS</text>
    <text x="0" y="60" font-family="'Abril Fatface', serif" font-size="26" fill="#333333">Flat Greasy Paste</text>
    <text x="0" y="85" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#777777">Direct cream boiled at high heat; crystals destroyed.</text>
    
    <!-- Flat amorphous representation -->
    <g transform="translate(185, 230)">
      <circle cx="0" cy="0" r="110" fill="#f4f4f4" stroke="#cccccc" stroke-width="2"/>
      <!-- Flat grease puddles -->
      <ellipse cx="-20" cy="-30" rx="55" ry="30" fill="#e2e2e2"/>
      <ellipse cx="30" cy="20" rx="60" ry="35" fill="#dedede"/>
      <ellipse cx="-10" cy="40" rx="45" ry="25" fill="#e5e5e5"/>
      <ellipse cx="10" cy="-40" rx="40" ry="20" fill="#ebebeb"/>
    </g>
    <text x="185" y="380" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="600" fill="#882222" text-anchor="middle">✕ Waxy mouthfeel • Acidic • Flat boiled scent</text>
  </g>
</svg>