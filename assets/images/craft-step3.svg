<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bw3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#040404"/>
    </linearGradient>
    <radialGradient id="fireglow" cx="50%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#c88a22" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#144528" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bw3)"/>
  <rect width="800" height="600" fill="url(#fireglow)"/>
  <line x1="40" y1="40" x2="760" y2="40" stroke="#333333" stroke-width="1"/>
  <line x1="40" y1="560" x2="760" y2="560" stroke="#333333" stroke-width="1"/>

  <!-- Brass cauldron / Degchi -->
  <g transform="translate(400, 370)">
    <!-- Low flame embers below -->
    <ellipse cx="0" cy="130" rx="130" ry="20" fill="#000000"/>
    <path d="M-80,120 Q0,80 80,120 Q40,140 0,135 Q-40,140 -80,120 Z" fill="#e5a83b" opacity="0.6"/>
    <!-- Heavy Brass Vessel -->
    <path d="M-150,0 C-150,80 -80,120 0,120 C80,120 150,80 150,0 L160,-20 L-160,-20 Z" fill="#29241d" stroke="#524838" stroke-width="2"/>
    <!-- Liquid Golden Ghee surface -->
    <ellipse cx="0" cy="-20" rx="155" ry="30" fill="#c88a22" opacity="0.75"/>
    <ellipse cx="0" cy="-20" rx="140" ry="25" fill="#f5b335" opacity="0.85"/>
    <!-- Simmer bubbles / aroma waves -->
    <circle cx="-40" cy="-22" r="6" fill="#fff" opacity="0.7"/>
    <circle cx="20" cy="-18" r="4" fill="#fff" opacity="0.6"/>
    <circle cx="70" cy="-25" r="5" fill="#fff" opacity="0.7"/>
    <!-- Gentle steam curves -->
    <path d="M-50,-40 Q-40,-90 -60,-130" stroke="#888888" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
    <path d="M0,-50 Q20,-100 0,-150" stroke="#888888" stroke-width="2" fill="none" opacity="0.5" stroke-linecap="round"/>
    <path d="M50,-40 Q70,-80 50,-130" stroke="#888888" stroke-width="2" fill="none" opacity="0.4" stroke-linecap="round"/>
  </g>

  <g transform="translate(60, 80)">
    <rect width="180" height="32" fill="#144528" rx="4"/>
    <text x="90" y="21" font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="600" fill="#ffffff" letter-spacing="2" text-anchor="middle">STEP 03 • LOW-FLAME SIMMER</text>
    <text x="0" y="65" font-family="'Abril Fatface', serif" font-size="32" fill="#ffffff">Slow Clarification</text>
    <text x="0" y="95" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" fill="#a0a0a0">Heavy brass vessels allow milk solids to gently separate naturally.</text>
  </g>
  <g transform="translate(680, 530)">
    <text x="0" y="0" font-family="'Abril Fatface', serif" font-size="48" fill="#262626" text-anchor="end">03</text>
  </g>
</svg>